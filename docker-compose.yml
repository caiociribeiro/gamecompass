services:
  neo4j:
    image: neo4j:5.23.0-community
    container_name: gamecompass-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD no arquivo .env}"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          NEO4J_USERNAME="$${NEO4J_AUTH%%/*}"
          NEO4J_PASSWORD="$${NEO4J_AUTH#*/}"
          cypher-shell -a bolt://localhost:7687 'RETURN 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend
    container_name: gamecompass-api
    restart: unless-stopped
    environment:
      APP_NAME: "GameCompass API"
      WEB_CONCURRENCY: "${API_WORKERS:-4}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD no arquivo .env}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      GAMECOMPASS_ROOT: "/workspace"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      DEMO_NAME: "${DEMO_NAME:-Demo}"
      DEMO_EMAIL: "${DEMO_EMAIL:-}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./data:/workspace/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert json.load(response).get('status') == 'ok'"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      neo4j:
        condition: service_healthy

  # Site (build do frontend servido pelo vite preview, com /api repassado para a API).
  # Para trabalhar no código com recarga automática, pare este serviço e use npm run dev.
  frontend:
    build:
      context: ./frontend
    container_name: gamecompass-frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: "http://api:8000"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  # Executado sob demanda: docker compose run --rm data
  data:
    profiles: ["data"]
    build:
      context: ./scripts
    working_dir: /workspace
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD no arquivo .env}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    volumes:
      - ./scripts:/workspace/scripts
      - ./data:/workspace/data
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
