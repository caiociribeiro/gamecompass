services:
  neo4j:
    image: neo4j:5.23.0-community
    container_name: gamecompass-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD no arquivo .env}"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          NEO4J_USERNAME="$${NEO4J_AUTH%%/*}"
          NEO4J_PASSWORD="$${NEO4J_AUTH#*/}"
          cypher-shell -a bolt://localhost:7687 'RETURN 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend
    container_name: gamecompass-api
    restart: unless-stopped
    environment:
      APP_NAME: "GameCompass API"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD no arquivo .env}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      GAMECOMPASS_ROOT: "/workspace"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./data:/workspace/data:ro
    depends_on:
      neo4j:
        condition: service_healthy

  # Executado sob demanda: docker compose run --rm data
  data:
    profiles: ["data"]
    build:
      context: ./scripts
    working_dir: /workspace
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD no arquivo .env}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    volumes:
      - ./scripts:/workspace/scripts
      - ./data:/workspace/data
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
